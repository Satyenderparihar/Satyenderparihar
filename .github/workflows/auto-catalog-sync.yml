name: 🤖 Auto-Catalog Sync (Overview Categories)

on:
  schedule:
    # Run automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/auto-catalog-sync.yml'

permissions:
  contents: write

jobs:
  sync-catalog:
    name: Auto-Categorize & Sync Overview Repositories
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔄 Run Auto-Catalog Script
        run: node scripts/auto_catalog.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No repository catalog changes detected. Everything is up to date!"
          else
            git commit -m "🤖 auto-sync: update categorized repositories in Overview [skip ci]"
            git push origin main
          fi
